<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HygieneGPT - Exhibition Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🩺</span>
            <h1 class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">HygieneGPT</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="toggleMode()" id="modeBtn" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-sm font-medium transition">Switch to Comparison Mode</button>
            <select id="langSelect" class="bg-slate-700 text-sm px-2 py-1.5 rounded-lg border border-slate-600 focus:outline-none">
                <option value="en">English</option>
                <option value="ta">தமிழ் (Tamil)</option>
            </select>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col md:flex-row gap-4">
        <!-- Chat Area -->
        <section class="flex-1 flex flex-col bg-slate-800/50 backdrop-blur border border-slate-700/60 rounded-2xl overflow-hidden shadow-xl">
            <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-4 max-h-[65vh]">
                <div class="flex items-start space-x-3">
                    <div class="bg-emerald-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold">H</div>
                    <div class="bg-slate-800 border border-slate-700 p-3 rounded-2xl max-w-[80%] text-sm">
                        Hello! Ask me any hygiene question. I source my answers strictly from WHO, CDC, and Indian Health Ministry guidelines.
                    </div>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="p-3 bg-slate-800 border-t border-slate-700 flex items-center space-x-2">
                <button onclick="toggleVoiceInput()" id="micBtn" class="p-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl transition text-slate-300">🎤</button>
                <input type="text" id="userInput" placeholder="Ask about hand washing, water safety, sanitization..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-emerald-500">
                <button onclick="sendMessage()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-emerald-500/20">Send</button>
            </div>
        </section>

        <!-- Click-to-Verify Citation Drawer -->
        <aside class="w-full md:w-80 bg-slate-800/50 backdrop-blur border border-slate-700/60 rounded-2xl p-4 flex flex-col shadow-xl">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Source Inspector</h2>
            <div id="sourceInspector" class="flex-1 bg-slate-900/60 border border-slate-700/40 rounded-xl p-3 text-xs text-slate-300 overflow-y-auto">
                <p class="text-slate-500 italic">Click any citation in chat answers to inspect the exact reference passage from WHO/CDC documents here.</p>
            </div>
        </aside>
    </main>

    <script>
        let isComparisonMode = false;

        function toggleMode() {
            isComparisonMode = !isComparisonMode;
            const btn = document.getElementById('modeBtn');
            if (isComparisonMode) {
                btn.textContent = "Switch to Standard Mode";
                document.getElementById('userInput').value = "Is it okay to use soda or wipe hands on clothes if no water?";
            } else {
                btn.textContent = "Switch to Comparison Mode";
                document.getElementById('userInput').value = "";
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            if (!query) return;

            appendMessage(query, 'user');
            input.value = '';

            const chatBox = document.getElementById('chatBox');
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="text-xs text-slate-500 italic p-2">Searching guidelines and generating response...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            if (isComparisonMode) {
                const res = await fetch('http://localhost:5000/api/compare', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ query })
                });
                const data = await res.json();
                document.getElementById(loadingId).remove();
                
                appendComparisonResponse(data.normal_chatbot, data.hygiene_gpt);
            } else {
                const res = await fetch('http://localhost:5000/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ query })
                });
                const data = await res.json();
                document.getElementById(loadingId).remove();

                appendAssistantResponse(data.answer, data.citations);
            }
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            if (sender === 'user') {
                chatBox.innerHTML += `
                    <div class="flex justify-end">
                        <div class="bg-emerald-600 text-white p-3 rounded-2xl max-w-[80%] text-sm shadow">${escapeHtml(text)}</div>
                    </div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendAssistantResponse(answer, citations) {
            const chatBox = document.getElementById('chatBox');
            let citationHtml = '';
            
            citations.forEach(cit => {
                citationHtml += ` <button onclick='inspectSource(${JSON.stringify(cit)})' class="text-xs bg-cyan-950 text-cyan-300 border border-cyan-800 px-1.5 py-0.5 rounded hover:bg-cyan-900 transition">[${cit.source}, p. ${cit.page}]</button>`;
            });

            chatBox.innerHTML += `
                <div class="flex items-start space-x-3">
                    <div class="bg-emerald-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-xs">H</div>
                    <div class="bg-slate-800 border border-slate-700 p-3 rounded-2xl max-w-[85%] text-sm space-y-2">
                        <p>${escapeHtml(answer)}</p>
                        <div class="flex flex-wrap gap-1 mt-1">${citationHtml}</div>
                    </div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            speakText(answer);
        }

        function appendComparisonResponse(normal, gpt) {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 my-2">
                    <div class="bg-rose-950/40 border border-rose-900/60 p-3 rounded-xl text-xs space-y-1">
                        <span class="font-bold text-rose-400 uppercase">Normal Chatbot (No RAG):</span>
                        <p class="text-slate-300">${escapeHtml(normal)}</p>
                    </div>
                    <div class="bg-emerald-950/40 border border-emerald-900/60 p-3 rounded-xl text-xs space-y-1">
                        <span class="font-bold text-emerald-400 uppercase">HygieneGPT (With RAG):</span>
                        <p class="text-slate-300">${escapeHtml(gpt)}</p>
                    </div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function inspectSource(cit) {
            const inspector = document.getElementById('sourceInspector');
            inspector.innerHTML = `
                <div class="space-y-2">
                    <span class="font-bold text-cyan-400">${escapeHtml(cit.source)} (Page ${cit.page})</span>
                    <p class="bg-slate-900 p-2 rounded border border-slate-800 text-slate-300 leading-relaxed">${escapeHtml(cit.text)}</p>
                </div>`;
        }

        function toggleVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser.");
                return;
            }
            const recognition = new SpeechRecognition();
            const lang = document.getElementById('langSelect').value === 'ta' ? 'ta-IN' : 'en-US';
            recognition.lang = lang;
            recognition.onresult = (event) => {
                document.getElementById('userInput').value = event.results[0][0].transcript;
                sendMessage();
            };
            recognition.start();
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = document.getElementById('langSelect').value === 'ta' ? 'ta-IN' : 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
